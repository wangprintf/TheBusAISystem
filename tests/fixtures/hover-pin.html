<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备与工单小窗 · 悬停计时验证</title>
<link rel="stylesheet" href="/web/styles.css">
<link rel="stylesheet" href="/web/app-custom.css">
<link rel="stylesheet" href="/web/device-health.css">
<link rel="stylesheet" href="/web/order-status.css">
<link rel="stylesheet" href="/web/hover-pin.css">
<style>
  body.dashboard-page{overflow:auto;min-height:100vh;background:#061421}
  .hover-fixture{max-width:1100px;padding:30px;margin:auto}
  .hover-fixture h1{color:#dff6ff;font-size:22px}
  .hover-fixture>p{margin:10px 0;color:#8fb1c4}
  .hover-fixture-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}
  .hover-fixture-grid>article{min-width:0;padding:18px;border:1px solid #2b6c84;background:#0a2333}
  .hover-fixture-grid h2{color:#c6e8f7;margin-bottom:12px}
  .hover-fixture button[data-run],.hover-fixture button[data-update],#outside{background:#174a62;color:#d6f4ff;border:1px solid #407f98;border-radius:4px;padding:10px;margin:6px 8px 6px 0;cursor:pointer}
  #results{display:block;white-space:pre-wrap;color:#9dd7c6;line-height:1.7}
  #selection{margin:12px 0;color:#a1c3d3}
  .hover-fixture .device-pie-legend{grid-template-columns:repeat(3,1fr)}
  @media(max-width:700px){.hover-fixture-grid{grid-template-columns:1fr}}
</style>
<body class="app-ready dashboard-page">
<main class="hover-fixture">
  <h1>设备与工单小窗 · 悬停计时验证</h1>
  <p>测试数据。移入扇区或图例后，圆圈从 0 走到 1 秒，完成后只能用 × 关闭。</p>
  <button id="outside" type="button">外部空白区域</button><button type="button" data-update>更新测试数据</button><button type="button" data-run>运行交互计时检查</button>
  <div class="hover-fixture-grid"><article><h2>设备运维</h2><div id="device-chart"></div></article><article><h2>工单状态</h2><div id="order-chart"></div></article></div>
  <p id="selection">未选择详情</p><output id="results">等待检查</output>
</main>
<script type="module" src="/tests/fixtures/hover-pin-browser.js"></script>
</body></html>
